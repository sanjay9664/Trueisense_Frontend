                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnumItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profiles/{profileId}:
    get:
      tags: [DeviceProfiles]
      summary: Get Device Profile By ID
      description: Retrieves full details of a specific device profile including field mappings, default thresholds, dashboard configuration, and active linked devices.
      parameters:
        - name: profileId
          in: path
          required: true
          description: Unique CUID identifier of the device profile
          schema:
            type: string
          example: "cm71abcdef0123456789"
      responses:
        '200':
          description: Device profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [DeviceProfiles]
      summary: Update Device Profile
      description: Updates an existing device profile's attributes, field mappings, thresholds, or dashboard configuration. Requires ADMIN permission.
      parameters:
        - name: profileId
          in: path
          required: true
          description: Unique CUID identifier of the device profile
          schema:
            type: string
          example: "cm71abcdef0123456789"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: "Updated Schneider EM6400NG Energy Meter"
              description: "Updated 3-phase meter configuration"
              dashboardConfig:
                primaryField: "power_total"
                statusField: "status"
                gaugeFields: ["voltage_r_phase", "current_r_phase"]
                chartFields: ["power_total", "energy_today"]
      responses:
        '200':
          description: Device profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
