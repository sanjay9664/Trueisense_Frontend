  # ============================================================
  # H4. TELEMETRY SERVICE
  # ============================================================
  /sites/{siteId}/devices/{deviceId}/telemetry/snapshots:
    get:
      tags: [Telemetry]
      summary: Get Device Telemetry Snapshots
      description: |
        Retrieves periodic telemetry snapshots (15-min, hourly, daily, monthly) for a device.
        Supports two query modes:
        1. **Single Setting Mode:** Supply `settingId` (numeric ID, e.g. 18) OR legacy `fieldKey` (e.g. "4,28F"). Returns a flat object with `snapshots: [...]`.
        2. **Device-Wide Multi-Setting Mode:** Omit setting parameters to return all active non-command telemetry settings for the device, or supply `settingIds` (comma-separated list, e.g. "15,18,25"). Returns `{ settingsCount, settings: [ { settingId, fieldKey, displayName, unit, isCumulative, snapshots: [...] }, ... ] }`.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
          example: 3
        - name: settingId
          in: query
          required: false
          schema:
            type: integer
          description: Unique DeviceSetting ID for single setting retrieval (preferred).
          example: 18
        - name: fieldKey
          in: query
          required: false
          schema:
            type: string
          description: Legacy Sochiot field key for single setting retrieval.
          example: "4,28F"
        - name: settingIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of setting IDs for multi-setting retrieval (e.g., "15,18,25"). If omitted along with settingId/fieldKey, all active telemetry settings for the device are returned.
          example: "15,18,25"
        - name: interval
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SamplingInterval'
            default: "HOURLY"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-08-01T00:00:00.000Z"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-08-10T00:00:00.000Z"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Successfully retrieved telemetry snapshots. Response structure adapts based on query mode.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SingleSettingSnapshotsResponse'
                  - $ref: '#/components/schemas/DeviceWideTelemetrySnapshotsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/devices/{deviceId}/telemetry/resync:
    post:
      tags: [Telemetry]
      summary: Resync Single Device Telemetry
      description: Re-aggregates raw MongoDB events into PostgreSQL rollups for a single device over a date range. Requires PERM_INST_MANAGE_DEVICE permission.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncTelemetryRequest'
      responses:
        '200':
          description: Device telemetry resync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /sites/{siteId}/telemetry/area/{areaId}/summary:
    get:
      tags: [Telemetry]
      summary: Get Area Telemetry Summary
      description: Retrieves telemetry readings for all active devices in a specific area, enriched with setting IDs on live fields.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Area telemetry summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      areaId:
                        type: integer
                        example: 5
                      devices:
                        type: array
                        items:
                          type: object

  /sites/{siteId}/telemetry/system/{functionalSystem}/summary:
    get:
      tags: [Telemetry]
      summary: Get Functional System Telemetry Summary
      description: Retrieves telemetry readings for all devices belonging to a functional system (e.g. HVAC, ELECTRICAL), enriched with setting IDs on live fields.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: functionalSystem
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FunctionalSystem'
          example: "ELECTRICAL"
      responses:
        '200':
          description: System telemetry summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      functionalSystem:
                        type: string
                        example: "ELECTRICAL"
                      devices:
                        type: array
                        items:
                          type: object

  /sites/{siteId}/telemetry/energy-summary:
    get:
      tags: [Telemetry]
      summary: Get Site Energy Summary
      description: Computes total energy consumption across configured energy groups for a site, joining cumulative registers by settingId and delta.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-08-01T00:00:00.000Z"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-08-10T00:00:00.000Z"
      responses:
        '200':
          description: Energy summary across energy groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnergySummaryResponse'

  # ============================================================
  # I. NOTIFICATION SERVICE
  # ============================================================
  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send Notification
      description: Dispatch email, in-app, SMS, or webhook notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
            example:
              email: "user@example.com"
              type: "ALARM_TRIGGERED"
              channel: "EMAIL"
              subject: "🚨 Critical Voltage Alarm"
              message: "Device EM_LIVEWIZE_178 reported high voltage."
      responses:
        '200':
          description: Notification dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /notifications/in-app:
    get:
      tags: [Notifications]
      summary: List In-App Notifications
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: isRead
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated in-app notifications

  # ============================================================
  # J. TICKETS, REPORTS & ALARMS
  # ============================================================
  /reports/generate:
    post:
      tags: [Reports]
      summary: Generate Async Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
      responses:
        '202':
          description: Report job queued

  /alarms/trigger:
    post:
      tags: [Alarms]
      summary: Trigger Alarm Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerAlarmRequest'
      responses:
        '201':
          description: Alarm triggered

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 10

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or token missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict or duplicate entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- ENUMS ---
    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, MANAGER, OPERATOR, VIEWER]
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED, PENDING_VERIFICATION]
    CompanyStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
    AssetType:
      type: string
      enum: [BUILDING, FLOOR, AREA, ROOM, CUBICLE, EQUIPMENT, MACHINE, LINE, PANEL, DG, LT_ROOM, PUMP_ROOM, OTHER]
    AssetStatus:
      type: string
      enum: [ACTIVE, INACTIVE, MAINTENANCE]
    DeviceCategory:
      type: string
      enum:
        - ENERGY_METER
        - MAIN_ENERGY_METER
        - SUB_ENERGY_METER
        - UG_TANK
        - AG_TANK
        - PUMP
        - VALVE
        - GENERATOR
        - LT_PANEL
        - FIRE_PUMP
        - HVAC_CHILLER
        - HVAC_AHU
        - HVAC_COOLING_TOWER
        - VRV
        - AQI_SENSOR
        - BREAKER
        - STP
        - WTP
        - LIFT
        - LIGHTING
        - FIRE_PANEL
        - CONTROLLER
        - SENSOR
        - AC
        - OTHER
    FunctionalSystem:
      type: string
      enum:
        - WATER_SUPPLY
        - SEWAGE
        - WATER_TREATMENT
        - DG_POWER
        - ELECTRICAL
        - FIRE_SAFETY
        - HVAC
        - LIGHTING_CONTROL
        - LIFT_ELEVATOR
        - AIR_QUALITY
        - GENERIC
    AlarmSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    FieldDataType:
      type: string
      enum: [INTEGER, FLOAT, STRING, BOOLEAN, ENUM]
    TelemetryType:
      type: string
      enum: [AVERAGE, MIN, MAX, SUM, LAST]
    ReportWidgetType:
      type: string
      enum: [OVERALL, INDIVIDUAL, COMPARATIVE]
    SamplingInterval:
      type: string
      enum: [MIN_15, HOURLY, DAILY, MONTHLY]
    ActionSource:
      type: string
      enum: [USER, RULE_ENGINE, SCHEDULE, SYSTEM]
    CommandStatus:
      type: string
      enum: [SENT, ACKNOWLEDGED, FAILED, TIMED_OUT]

    # --- RESPONSES ---
    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            path:
              type: string
            timestamp:
              type: string
              format: date-time

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3

    # --- ENTITY MODELS ---
    User:
      type: object
      properties:
        id:
          type: string
          example: "usr_123456789"
