                $ref: '#/components/schemas/SuccessMessageResponse'

  # ============================================================
  # G. ASSETS SERVICE (Building -> Floor -> Area -> Cubicle -> Equipment)
  # ============================================================
  /sites/{siteId}/assets:
    get:
      tags: [Assets]
      summary: List Assets For Site
      description: Retrieve paginated list of assets under a site with optional filtering by type, status, hierarchy level/depth, path, or search text.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: parentId
          in: query
          schema:
            type: string
        - name: depth
          in: query
          description: Exact hierarchy depth level (0 for root, 1 for floor, 2 for area, etc.)
          schema:
            type: integer
        - name: minDepth
          in: query
          schema:
            type: integer
        - name: maxDepth
          in: query
          schema:
            type: integer
        - name: pathPrefix
          in: query
          description: Materialized path prefix to query subtrees (e.g., /building_main/floor_1)
          schema:
            type: string
        - name: search
          in: query
          description: Search term matching asset name, description, or serial number
          schema:
            type: string
      responses:
        '200':
          description: Paginated assets list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'

    post:
      tags: [Assets]
      summary: Create Asset In Site
      description: Create a new asset in the site hierarchy. Automatically calculates depth and materialized path.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
            example:
              name: "Area 1 - Floor 1"
              assetType: "AREA"
              parentId: "floor_1"
              order: 1
              description: "Open workspace area"
              metadata:
                capacity: 40
                sqft: 2000
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: Bad Request - Site is inactive, circular parent, or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Site or parent asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - Duplicate asset name under the same parent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sites/{siteId}/assets/hierarchy:
    get:
      tags: [Assets]
      summary: Get Site Asset Hierarchy Tree
      description: Returns an arbitrary-depth recursive tree of all assets for the site, including nested children and linked devices.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: rootAssetId
          in: query
          description: Optional root asset ID to retrieve subtree from
          schema:
            type: string
      responses:
        '200':
          description: Recursive asset hierarchy tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object

  /sites/{siteId}/assets/stats:
    get:
      tags: [Assets]
      summary: Get Site Asset Statistics
      description: Aggregated statistics of assets by type, status, depth levels, and linked devices.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Asset statistics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      byType:
                        type: object
                      byStatus:
                        type: object
                      byDepth:
                        type: object
                      devices:
                        type: integer

  /sites/{siteId}/assets/types/{assetType}:
    get:
      tags: [Assets]
      summary: Get Assets By Type
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: assetType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: List of assets matching the specified type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'

  /assets:
    get:
      tags: [Assets]
      summary: List Assets Across Accessible Sites
      description: Returns all assets across all sites accessible to the authenticated user based on their authtoken and permissions. If the `siteId` query parameter is provided, verifies user site access permission and returns assets for that specific site (or empty array if access is not permitted).
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: siteId
          in: query
          description: Optional site ID to filter assets. User must have access permission to this site.
          schema:
            type: integer
            example: 7
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: search
          in: query
          description: Search term matching asset name, description, or serial number
          schema:
            type: string
        - name: parentId
          in: query
          description: Parent asset ID (or 'null' for root assets)
          schema:
            type: string
        - name: depth
          in: query
          description: Exact hierarchy depth level (0 for root, 1 for floor, 2 for area, etc.)
          schema:
            type: integer
        - name: minDepth
          in: query
          schema:
            type: integer
        - name: maxDepth
          in: query
          schema:
            type: integer
        - name: pathPrefix
          in: query
          description: Materialized path prefix to query subtrees (e.g., /building_main/floor_1)
          schema:
            type: string
        - name: includeChildren
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated assets list with site details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Assets]
      summary: Create Asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
            example:
              siteId: 7
              name: "Main Building"
              assetType: "BUILDING"
              description: "Primary testing building"
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'

  /assets/{id}:
    get:
      tags: [Assets]
      summary: Get Asset Details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Assets]
      summary: Update Asset
      description: Update asset properties. If parentId changes, depth and materialized paths of the asset and all its subtree descendants are automatically recalculated.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
            example:
              name: "Area 1 - Floor 1 (Renovated)"
              order: 2
              metadata:
                capacity: 60
                sqft: 2400
      responses:
        '200':
          description: Asset updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: Bad Request - Circular hierarchy reference or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset or new parent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Assets]
      summary: Soft Delete Asset
      description: Soft deletes the asset and all its recursive subtree descendants. Rejects if active devices are still attached.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Asset and subtree soft-deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: Bad Request - Asset or descendants have associated active devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /assets/{id}/tree:
    get:
      tags: [Assets]
      summary: Get Asset Hierarchy Subtree
      description: Returns recursive child asset subtree for a specific asset node.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Recursive asset subtree
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object

  /assets/{id}/devices:
    get:
      tags: [Assets]
      summary: Get All Devices Under Asset
      description: Retrieves all active devices linked to this asset or any of its recursive child assets in the subtree.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of devices under the asset subtree
          content:
            application/json:
              schema:
                type: object
