  # ============================================================
  # F. SITES SERVICE
  # ============================================================
  /sites:
    get:
      tags: [Sites]
      summary: List Sites
      description: Retrieve sites accessible to the current user. Superadmin users receive all sites (both active and inactive) so inactive sites can be inspected and re-enabled. Non-superadmin users receive accessible sites tagged with status ACTIVE or INACTIVE; if all accessible sites are inactive, a 'Site is inactive' message is returned.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Site is inactive"
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Site'
    post:
      tags: [Sites]
      summary: Create Site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
            example:
              name: "Noida Testing Site"
              sochiotLocationId: 7
              organizationId: 7
              tenantId: "c2a8b410-449e-11ee-be56-0242ac120002"
              city: "Noida"
              state: "Uttar Pradesh"
      responses:
        '201':
          description: Site created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /sites/templates-and-features:
    get:
      tags: [Sites]
      summary: Get Site Templates and Features
      description: Returns the standardized enums and metadata for selectable BMS site templates and features.
      responses:
        '200':
          description: Available site templates and features metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "Smart-DG"
                            label:
                              type: string
                              example: "Smart DG"
                      features:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "Dashboard"
                            label:
                              type: string
                              example: "Dashboard"

  /sites/{id}:
    get:
      tags: [Sites]
      summary: Get Site Details
      description: Retrieve details for a specific site. Superadmin users can retrieve details of active or inactive sites. For non-superadmin users, inactive sites return a 400 error with code SITE_INACTIVE.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Site details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: Bad Request - Site is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User does not have access to this site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Site not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Sites]
      summary: Update Site
      description: Update site details such as name, address, city, state, timezone, multi-tenant hierarchy mapping, or active status.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
            example:
              name: "Noida Testing Site Updated"
              city: "Noida"
              state: "Uttar Pradesh"
              isActive: true
      responses:
        '200':
          description: Site updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      tags: [Sites]
      summary: Soft Delete Site
      description: Soft deletes the site by disabling it (setting isActive = false) and disabling all associated active devices (setting isActive = false).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Site soft-deleted and disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /sites/{id}/stats:
    get:
      tags: [Sites]
      summary: Get Site Stats & Metrics
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Site device count, active alarms, energy metrics

  /sites/{siteId}/telemetry/resync:
    post:
      tags: [Telemetry]
      summary: Resync Telemetry Data
      description: Re-aggregates raw MongoDB events into PostgreSQL rollups for a site over a date range. Requires PERM_INST_MANAGE_DEVICE permission.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncTelemetryRequest'
      responses:
        '200':
          description: Resync process completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

