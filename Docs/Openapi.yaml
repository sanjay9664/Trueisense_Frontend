                    $ref: '#/components/schemas/Building'
    delete:
      tags: [Buildings]
      summary: Delete Building
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: buildingId
          in: path
          required: true
          schema:
