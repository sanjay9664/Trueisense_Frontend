        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices:
    get:
      tags: [Devices]
      summary: List Devices Across Sites
      description: Retrieves paginated devices across all accessible sites. Supports filtering by category, area, building, active status, search text, or specific siteId (Super Admin).
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/DeviceCategory'
        - name: areaId
          in: query
          schema:
            type: integer
        - name: buildingId
          in: query
          schema:
            type: integer
        - name: siteId
          in: query
          schema:
            type: integer
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: templateName
          in: query
          schema:
            type: string
        - name: include
          in: query
          description: Comma-separated list of relations to include (e.g. `settings,rules,profile,area,building,energyGroup` or `none`).
          schema:
            type: string
            example: "settings,rules,profile"
      responses:
        '200':
          description: Paginated devices list across sites
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeviceListItem'

  /devices/{id}:
    get:
      tags: [Devices]
      summary: Get Device Details Directly
      description: Retrieves complete detailed information for a single device by its numeric ID or BMS device ID, including full profiles, settings, rules, and hardware links.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Numeric device ID or unique BMS Device ID (e.g. BMS-0001)
          example: "9"
      responses:
        '200':
          description: Complete device detail record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Devices]
      summary: Update Device
      description: |
        Update device attributes, category, relations (area, building, asset, energy group), or configuration by internal device ID.
        The associated `siteId` can be supplied via query parameter (`?siteId=...`), in the request body (`siteId`), or omitted completely (in which case it is automatically resolved from the device record).
        Requires `PERM_INST_MANAGE_DEVICE` permission. For non-superadmin users, multi-tenant site access is strictly verified against the user's permitted sites.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Internal Device ID
          schema:
            type: integer
            example: 1
        - name: siteId
          in: query
          required: false
          description: Optional site ID to verify or scope device update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
            example:
              name: "Main Air Handling Unit"
              category: "HVAC_AHU"
              areaId: 2
              buildingId: 1
              displayOrder: 1
      responses:
        '200':
          description: Device updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /devices/{deviceId}/events/latest:
    get:
      tags: [Devices]
      summary: Get Latest Device Events Directly
      description: |
        Retrieves the latest telemetry readings from MongoDB for all unique modules configured on the device.
        Matches the device by BMS device ID (`bmsDeviceId`), numeric internal ID, or Sochiot device ID.
        Values are mapped against configured device settings (`DeviceSetting`) with display names, units, data types, and formatted timestamps.
        Responses are cached in Redis with a 30-second TTL for high-throughput dashboard polling.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: Internal Device ID (integer), Sochiot Device ID (integer), or BMS Device ID (string/CUID/UUID)
          example: "85865132-44f0-4a69-9d67-116a7b2482f6"
      responses:
        '200':
          description: Latest formatted device telemetry and module events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceLatestEventsData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}/latest:
    get:
      tags: [Devices]
      summary: Get Latest Device Events Directly (Alias)
      description: Alias endpoint for `GET /api/v1/devices/{deviceId}/events/latest`. Retrieves latest formatted telemetry event data cached for 30 seconds.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: Internal Device ID (integer), Sochiot Device ID (integer), or BMS Device ID (string/CUID/UUID)
          example: "85865132-44f0-4a69-9d67-116a7b2482f6"
      responses:
        '200':
          description: Latest formatted device telemetry and module events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceLatestEventsData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/events/latest/batch:
    post:
      tags: [Devices]
      summary: Batch Get Latest Device Events
      description: |
        Fetches the latest formatted telemetry for **up to 20 devices** in a single request.
        Each device is resolved by its `bmsDeviceId` string. Devices already cached in Redis
        are returned instantly (30-second cache). Per-device errors are isolated — a failed
        lookup for one device does not affect the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIds]
              properties:
                deviceIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 20
                  description: List of bmsDeviceId strings (max 20)
                  example: ["DEV001", "85865132-44f0-4a69-9d67-116a7b2482f6"]
      responses:
        '200':
          description: Batch latest events response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeviceLatestEventsData'
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            deviceId:
                              type: string
                              example: "BAD_ID"
                            error:
                              type: string
                              example: "Device with identifier BAD_ID not found"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /resync-event-stats:
    post:
      tags: [Devices]
      summary: Global Device Event & Telemetry Resync
      description: Resyncs device raw telemetry events from MongoDB into PostgreSQL rollups starting from a given date. Requires PERM_INST_MANAGE_DEVICE permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncEventStatsRequest'
            example:
              id: 10
              dateTime: "2026-07-24T00:00:00.000Z"
      responses:
        '200':
          description: Resync completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

