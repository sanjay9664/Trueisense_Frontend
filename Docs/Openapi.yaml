  # ============================================================
  # H. DEVICE PROFILES, DEVICES, WIDGETS, RULES & COMMANDS SERVICE
  # ============================================================
  /profiles:
    get:
      tags: [DeviceProfiles]
      summary: List Device Profiles
      description: Retrieves paginated device profiles with active linked device summaries. Supports filtering by active status and category.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: Number of items per page (max 100)
          schema:
            type: integer
            default: 20
        - name: isActive
          in: query
          description: Filter profiles by active status
          schema:
            type: boolean
        - name: category
          in: query
          description: Filter profiles by device category
          schema:
            $ref: '#/components/schemas/DeviceCategory'
      responses:
        '200':
          description: Paginated list of device profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceProfile'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [DeviceProfiles]
      summary: Create Device Profile
      description: Creates a new device profile schema defining field mappings, default telemetry thresholds, and dashboard config. Requires ADMIN permission. Category must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
            example:
              name: "Schneider EM6400NG Energy Meter"
              category: "ENERGY_METER"
              functionalSystem: "ELECTRICAL"
              description: "Standard 3-phase multi-function power meter"
              fieldMappings:
                voltage_r_phase:
                  displayName: "R-Phase Voltage"
                  unit: "V"
                  dataType: "FLOAT"
                  isCommand: false
                  graphable: true
                  displayOrder: 1
                  enumValues: []
                power_total:
                  displayName: "Total Active Power"
                  unit: "kW"
                  dataType: "FLOAT"
                  isCommand: false
                  graphable: true
                  displayOrder: 2
                  enumValues: []
              defaultThresholds:
                voltage_r_phase:
                  warningHigh: 250
                  criticalHigh: 260
                  warningLow: 210
                  criticalLow: 200
              dashboardConfig:
                primaryField: "power_total"
                gaugeFields: ["voltage_r_phase"]
                chartFields: ["power_total"]
              isActive: true
      responses:
        '200':
          description: Device profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /profiles/enums:
    get:
      tags: [DeviceProfiles]
      summary: Get All Profile Enums
      description: Returns all supported device categories and functional systems with their identifiers and human-readable display names.
      responses:
        '200':
          description: Supported device categories and functional systems
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
