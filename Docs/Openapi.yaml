openapi: 3.0.3
info:
  title: BMS Platform Microservices API
  description: Unified OpenAPI 3.0.3 Specification for Building Management System (BMS) Microservices (Auth, Users, Invitations, Notifications, Tickets, Reports, Alarms, Tenants/Organizations, Zones, Areas, Sites, Buildings, Assets, Devices, Telemetry).
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Local Development Gateway
  - url: https://api.bms.com/v1
    description: Production Gateway

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication & Identity Management
  - name: Users
    description: User Profile & Role Administration
  - name: Invitations
    description: User Invitation & Access Delegation
  - name: Notifications
    description: Multi-channel Email, SMS & In-App Alerts
  - name: Companies
    description: SAAS Company Administration
  - name: Tenants
    description: Multi-tenant Organization Administration
  - name: Zones
    description: Geographic Zone Management
  - name: TenantAreas
    description: Area Administration within Zones
  - name: Sites
    description: Physical Site & Location Management
  - name: Buildings
    description: Building Management within Sites
  - name: Assets
    description: Hierarchical Asset Tree (Building -> Floor -> Room -> Equipment)
  - name: DeviceProfiles
    description: Device Profile Templates, Field Mappings, Default Thresholds & Enums
  - name: Devices
    description: Device Provisioning, Inventory, Templates, Settings & Status
  - name: Widgets
    description: Device Widget Panels, Metric Configurations & Display Ordering
  - name: Rules
    description: Device Condition, Comparison & Sochiot Automation Rules
  - name: Commands
    description: Hardware Commands & Control Pipeline
  - name: Telemetry
    description: Live & Historical Sensor Telemetry Data
  - name: Tickets
    description: Maintenance & Support Ticket Lifecycle
  - name: Reports
    description: Telemetry & DPR Report Generation
  - name: Alarms
    description: Real-time Device Alarm Monitoring & Acknowledgment

paths:
  # ============================================================
  # A. AUTH SERVICE
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: User Login
      description: Authenticates user credentials and returns JWT access token & HttpOnly refresh cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "sa@ismartaccess.com"
              password: "Password@123"
              rememberMe: true
      responses:
        '200':
          description: Successful Authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh Access Token
      description: Rotates refresh token and issues a new access token.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: "d9f8e7c6b5a4..."
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1Ni..."
                      refreshToken:
                        type: string
                        example: "7f9a8b1c2d3e4f5a6b7c8d9e0f..."
                      expiresIn:
                        type: integer
                        example: 900
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout User
      description: Revokes current refresh token and clears auth cookies.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request Password Reset
      description: Generates reset token and sends password reset email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: "user@example.com"
      responses:
        '200':
          description: Password reset request processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset Password With Token
      description: Resets password using the received reset token or code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
            example:
              token: "tok_reset_12345"
              newPassword: "NewPassword@123"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify Email Address
      description: Verifies user account using verification token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
            example:
              token: "v9u8t7s6r5q4..."
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get Current User Profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/Access-token:
    get:
      tags: [Auth]
      summary: Get Sochiot Auth Token
      description: Returns a valid Sochiot platform authentication token (Super Admin only). Authenticates with Sochiot auth engine using super admin credentials and caches the token in Redis for 14 minutes.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sochiot auth token returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SochiotTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # B. USERS SERVICE
  # ============================================================
  /users:
    get:
      tags: [Users]
      summary: List Users
      description: Retrieve paginated list of users with role, status, and tenant filtering.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create User
      description: Admin endpoint to create a user with multi-node zoneLocations and trigger an email invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: "Rajesh Padhi"
              email: "rajesh@sochiot.com"
              role: "ADMIN"
              roleId: 2
              tenantId: "c2a8b410-449e-11ee-be56-0242ac120002"
              zoneLocations:
                - zoneNodeType: "ZONE"
                  zoneNodeId: "18"
                - zoneNodeType: "SITE"
                  zoneNodeId: "7"
                - zoneNodeType: "ASSET"
                  zoneNodeId: "room_101"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get User Details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update User
      description: Updates user details, such as name, email, password, role, status, scope, or feature permissions.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: "Rajesh Padhi Updated"
              password: "NewUserPassword123!"
              role: "SUPER_ADMIN"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Soft Delete User
      description: Soft deletes the user by setting status to INACTIVE, setting deletedAt timestamp, clearing sochiotUserId, and appending a timestamp to the email address (e.g. user@example.com_deleted_1723456789) to avoid unique constraint conflicts on future re-creation.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User soft-deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /users/{id}/change-password:
    post:
      tags: [Users]
      summary: Admin Change User Password
      description: Allows an admin to forcefully change or reset another user's password.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Target User ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
                  description: New password for the user
            example:
              password: "NewUserPassword123!"
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/unlock:
    post:
      tags: [Users]
      summary: Admin Unlock User Account
      description: Unlocks a user account by clearing Redis lockout state and setting user status to ACTIVE in database.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Target User ID
          schema:
            type: string
      responses:
        '200':
          description: User account unlocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User account unlocked successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # B1. INVITATIONS SERVICE
  # ============================================================
  /invitations:
    post:
      tags: [Invitations]
      summary: Send User Invitation # Inferred from model
      description: Issues an email invitation token to a new user for account setup and access delegation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
            example:
              email: "invitee@example.com"
              role: "OPERATOR"
              invitedBy: "Admin User"
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /invitations/{token}:
    get:
      tags: [Invitations]
      summary: Get Invitation Details # Inferred from model
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /invitations/{token}/accept:
    post:
      tags: [Invitations]
      summary: Accept Invitation # Inferred from model
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, name]
              properties:
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
            example:
              name: "Accepted User"
              password: "Password@123"
      responses:
        '200':
          description: Invitation accepted and account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /invitations/{token}/decline:
    post:
      tags: [Invitations]
      summary: Decline Invitation # Inferred from model
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  # ============================================================
  # B2. COMPANIES SERVICE
  # ============================================================
  /companies:
    get:
      tags: [Companies]
      summary: Get all SAAS companies
      description: Retrieves a paginated list of SAAS companies (SuperAdmin only).
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          description: Filter by company status
          schema:
            $ref: '#/components/schemas/CompanyStatus'
        - name: search
          in: query
          description: Search by company name or code
          schema:
            type: string
      responses:
        '200':
          description: Paginated companies list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Companies]
      summary: Create a new SAAS company
      description: Creates a new SAAS company record in BMS (SuperAdmin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            example:
              name: "Acme Corporation"
              code: "ACME"
              email: "contact@acme.com"
              phone: "+1-555-0199"
              address: "123 Business Way, Suite 100"
              sochiotOrgId: 101
              status: "ACTIVE"
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /companies/{id}:
    get:
      tags: [Companies]
      summary: Get company by ID
      description: Retrieves company details by ID (SuperAdmin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Company details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Update company
      description: Updates company details by ID (SuperAdmin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
            example:
              name: "Acme Corporation Updated"
              phone: "+1-555-0200"
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Companies]
      summary: Delete company
      description: Soft deletes a company by ID (SuperAdmin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Company deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{id}/tenants:
    get:
      tags: [Companies]
      summary: Get tenants under company
      description: Retrieves paginated tenants belonging to the specified company (SuperAdmin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated tenant list under company
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # C. TENANTS / ORGANIZATIONS SERVICE
  # ============================================================
  /tenants:
    get:
      tags: [Tenants]
      summary: List Organizations / Tenants
      description: Retrieve paginated list of tenants/organizations. Super Admins receive all tenants; regular users receive only their assigned tenant/organization.
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated tenant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
    post:
      tags: [Tenants]
      summary: Create Organization / Tenant
      description: Creates a new tenant/organization in BMS (Super Admin required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              companyId: "cmp_12345"
              name: "Sochiot Technologies"
              email: "info@sochiot.com"
              phone: "+91-1234567890"
              address: "Sector 63, Noida"
              sochiotOrgId: 7
              subscription: "BASIC"
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /tenants/{id}:
    get:
      tags: [Tenants]
      summary: Get Tenant Details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tenants]
      summary: Update Tenant
      description: Update tenant details (Super Admin required).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
            example:
              name: "Sochiot Technologies Ltd"
              phone: "+91-9876543210"
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    delete:
      tags: [Tenants]
      summary: Soft Delete Tenant
      description: Soft deletes tenant by setting status to INACTIVE (Super Admin required).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tenant soft-deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /tenants/{id}/features:
    patch:
      tags: [Tenants]
      summary: Update Tenant Features
      description: Update feature permission flags for a tenant (Super Admin required).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                features:
                  type: object
            example:
              features:
                alarm: true
                reports: true
                dpr: true
      responses:
        '200':
          description: Tenant features updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /tenants/{id}/subscription:
    patch:
      tags: [Tenants]
      summary: Update Tenant Subscription
      description: Update subscription type, period, or license validity (Super Admin required).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  type: string
                  enum: [BASIC, PREMIUM, ENTERPRISE]
                subscriptionPeriod:
                  type: string
                  enum: [MONTHLY, QUARTERLY, ANNUALLY]
                licenseValidity:
                  type: string
                  format: date-time
            example:
              subscription: "PREMIUM"
              subscriptionPeriod: "ANNUALLY"
      responses:
        '200':
          description: Tenant subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /tenants/{id}/dashboard:
    get:
      tags: [Tenants]
      summary: Get Tenant Overview Dashboard
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: High-level tenant dashboard metrics across sites and devices
          content:
            application/json:
              schema:
                type: object

  /tenants/{id}/reactivate:
    post:
      tags: [Tenants]
      summary: Reactivate Tenant
      description: Reactivates a soft-deleted tenant by clearing deletedAt, setting status to ACTIVE, and restoring associated zones and areas (Super Admin required).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tenant reactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # D. ZONES SERVICE
  # ============================================================
  /zones:
    get:
      tags: [Zones]
      summary: List Geographic Zones
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: tenantId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of zones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Zone'
    post:
      tags: [Zones]
      summary: Create Zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
            example:
              tenantId: "c2a8b410-449e-11ee-be56-0242ac120002"
              name: "Noida Region"
              region: "North India"
              timezone: "Asia/Kolkata"
      responses:
        '201':
          description: Zone created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /zones/{id}:
    get:
      tags: [Zones]
      summary: Get Zone Details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Zone details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
    patch:
      tags: [Zones]
      summary: Update Zone
