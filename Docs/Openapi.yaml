        Responses are cached in Redis with a 30-second TTL.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: Internal Device ID (integer), Sochiot Device ID (integer), or BMS Device ID (string/CUID/UUID)
          example: "85865132-44f0-4a69-9d67-116a7b2482f6"
      responses:
        '200':
          description: Latest formatted device telemetry and module events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeviceLatestEventsData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

